name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Google Scholar configuration
        id: config
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [[ -z "$GOOGLE_SCHOLAR_ID" ]]; then
            echo "::notice::GOOGLE_SCHOLAR_ID is not configured; citation update skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        id: crawler
        if: steps.config.outputs.enabled == 'true'
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          python -m pip install -r requirements.txt
          python main.py
          if [[ -f results/gs_data.json ]]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish citation data
        if: steps.crawler.outputs.has_data == 'true'
        working-directory: google_scholar_crawler/results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
